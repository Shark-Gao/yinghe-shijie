interface:
  display_name: "电视剧解说短视频"
  short_description: "以具体道具和完整冲突链制作可复盘的影视短视频"
  default_prompt: "使用 $yinghe-drama-short-video 制作电视剧短视频：先确定一个普通观众问题、一个具体道具或异常、一个已核验结果，分别评估内容完成度和分发潜力；前2秒给异常，前5秒说明危险，前10秒交付观看理由；默认同时生成原创中文解说版和屏幕注释纯原声版，并标记主版本；使用统一的宫廷悬疑编辑风封面，主标题突出道具或异常，副标题突出人物冲突和结果；完成三种比例、主页缩略图、成片验收和发布后数据复盘。"
